project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - projects.qmd
    - resume.qmd
    - contact.qmd
    - resources.qmd

website:
  title: "Joseph Falcone"
  description: "Portfolio of Joseph Falcone, an M.S. Business Analytics & AI candidate focused on data science, machine learning, deep learning, and data engineering."
  # Add your final URL when publishing:
  site-url: https://jfalcone.co
  navbar:
    background: light
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: resume.qmd
        text: Resume
      - href: contact.qmd
        text: Contact
      - href: resources.qmd
        text: Resources
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "© Joseph Falcone · Designed by me in NYC."
    right:
      - text: "Say hello ↗"
        href: contact.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    lang: en
    page-layout: full
    title-block-banner: false
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: false

